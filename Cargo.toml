[package]
name = "workboard"
version = "0.4.0"
license = "MIT"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "3"
hex = "0.4"
mime_guess = "2"
reqwest = { version = "0.13", default-features = false, features = ["query"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
rust-embed = "8"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
similar = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "io-util", "io-std", "sync", "process"] }
toml = "1.2"
url = "2"
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
tempfile = "3"
