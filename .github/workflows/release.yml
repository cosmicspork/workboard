name: release

# A tag vX.Y.Z builds the Tracon plugin archive for each target the plugin
# contract names and attaches them, with checksums.txt, to the release for
# that tag: created here, or added to when one already exists. Each archive
# holds tracon-plugin.toml, bin/workboard and ui/ (the built SPA, which the
# node serves itself; the binary embeds the same build for standalone use).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04
            linker: aarch64-linux-gnu-gcc
          - target: aarch64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag, Cargo.toml and tracon-plugin.toml agree
        shell: bash
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          plugin=$(sed -n 's/^version = "\(.*\)"$/\1/p' tracon-plugin.toml | head -1)
          if [ "$TAG" != "v$crate" ] || [ "$plugin" != "$crate" ]; then
            echo "tag $TAG, Cargo.toml $crate and tracon-plugin.toml $plugin disagree" >&2
            exit 1
          fi
          echo "VERSION=$crate" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      # The binary embeds spa/dist, so the SPA is built before cargo runs.
      - name: Build the SPA
        run: |
          bun install --cwd spa --frozen-lockfile
          bun run --cwd spa build
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target "$TARGET"
      - name: Install the cross linker
        if: matrix.linker
        env:
          LINKER: ${{ matrix.linker }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=$LINKER" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=$LINKER" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target "$TARGET"
      - name: Package
        shell: bash
        run: |
          mkdir -p stage/bin dist
          cp "target/$TARGET/release/workboard" stage/bin/
          cp tracon-plugin.toml stage/
          cp -R spa/dist stage/ui
          tar -czf "dist/workboard-$VERSION-$TARGET.tar.gz" -C stage tracon-plugin.toml bin ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workboard-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums.txt
        working-directory: dist
        run: sha256sum -- *.tar.gz > checksums.txt
      - name: Attach to the release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
          fi
